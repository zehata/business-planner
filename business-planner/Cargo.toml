[package]
name = "business-planner"
version = "0.0.0"
edition = "2024"

[dependencies]
# runtime
tokio = "1.48.0"

jiff = { version = "0.2.16", features=["serde"] }

# save files
serde = "1.0.228"
ciborium = "0.2.2"

# core
uuid = { version = "1.18.1", features = ["serde", "v4"] }
sonic-rs = "0.5.6"

# io (optional)
calamine = { version = "0.32.0", optional = true }
# umya-spreadsheet = { version = "2.3.3", optional = true }
csv = { version = "1.4.0", optional = true }
sqlx = { version = "0.8.6", features=["runtime-tokio", "postgres"], optional = true }
polars = { version = "0.52.0", features = ["serde"] }
regex = "1.12.2"

[dev-dependencies]
pgtemp = "0.6.0"

[features]
default = ["excel"]
# default = ["excel", "csv", "postgres"]
csv = ["dep:csv"]
excel = ["dep:calamine"]
postgres = ["dep:sqlx"]
