[package]
name = "business-planner-cli"
version = "0.0.0"
edition = "2024"

[dependencies]
business-planner = { path = "../business-planner" }
tokio = { version = "1.48.0", features = ["full"] }
bigdecimal = { version = "0.4.9", features = ["serde"] }
jiff = "0.2.16"
clap = { version = "4.5.51", features = ["derive"] }
dialoguer = { version = "0.12.0", features = ["completion", "history"] }
inquire = "0.9.1"
strum = "0.27.2"
strum_macros = "0.27.2"
uuid = { version = "1.18.1", features = ["v4"] }
shlex = "1.3.0"
fuzzy-matcher = "0.3.7"
enum-map = "2.7.3"